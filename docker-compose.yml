services:
  db:
    image: postgis/postgis:16-3.4
    container_name: trailquest_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trailquest}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trailquest}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot OSRM graph builder. Requires data/osrm/india-latest.osm.pbf to exist.
  # Run once before starting osrm-foot:
  #   docker compose --profile init up osrm-preprocess
  osrm-preprocess:
    image: osrm/osrm-backend:v5.27.1
    container_name: trailquest_osrm_preprocess
    profiles: ["init"]
    volumes:
      - ./data/osrm:/data
    entrypoint: /bin/sh -c
    command: >
      "osrm-extract -p /opt/foot.lua /data/india-latest.osm.pbf &&
       osrm-partition /data/india-latest.osrm &&
       osrm-customize /data/india-latest.osrm"

  osrm-foot:
    image: osrm/osrm-backend:v5.27.1
    container_name: trailquest_osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/india-latest.osrm
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./data/osrm:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
    driver: local
